name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 生成個人綜合數據卡片
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=solarized-light
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 生成最常用語言卡片
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&theme=solarized-light&hide=Jupyter%20Notebook
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. 生成精選專案卡片（目前是私人專案，先用 # 註解封印）
      # - name: Generate pin card
      #   uses: stats-organization/github-readme-stats-action@v2
      #   with:
      #     card: pin
      #     options: username=${{ github.repository_owner }}&repo=Glove&theme=solarized-light
      #     path: profile/pinned-project.svg
      #     token: ${{ secrets.GITHUB_TOKEN }}

      # 4. 自動將生成的圖片提交並推回專案中
      - name: Commit & Push cards
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          # 如果沒有變更就直接結束，避免報錯
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update README cards [skip ci]"
          git pull --rebase origin main
          git push origin main
