name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # 1. 生成個人綜合數據卡片
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 生成最常用語言卡片
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=radical
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. 生成精選專案卡片（請將下面 YOUR_REPO_NAME 改成你的專案名字）
      # - name: Generate pin card
      #   uses: stats-organization/github-readme-stats-action@v2
      #   with:
      #     card: pin
      #     options: username=${{ github.repository_owner }}&repo=Glove&theme=radical
      #     path: profile/pinned-project.svg
      #     token: ${{ secrets.GITHUB_TOKEN }}

      # 4. 自動將生成的圖片提交並推回專案中
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No changes in README cards."
          else
            git commit -m "chore: update README cards [skip ci]"
            git push
          fi
